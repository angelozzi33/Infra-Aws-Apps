# Deploy das aplicações (ADR-026):
#   dev  → automático após o merge na main (environment "desenvolvimento")
#   prod → logo depois do dev, mas ESPERA a liberação (environment "producao"). Com a ADR-027, quem
#          libera é o gestor no Portal Infra-Aws (o GitHub App do Portal é a regra de proteção do
#          environment); sem ela, "Required reviewers". A role de prod só aceita tokens desse environment.
#          O Portal identifica as apps pelo nome do job: mantenha "prod (<app>)".
# Também pode ser disparado à mão (Actions → Run workflow) para uma aplicação.
# Repositório público: IDs de conta mascarados nos logs.
name: Deploy das aplicações

on:
  push:
    branches: [main]
    paths: ["apps/**"]
  workflow_dispatch:
    inputs:
      aplicacao:
        description: "Nome da aplicação (pasta em apps/)"
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  CDK_DISABLE_VERSION_CHECK: "1"
  VERSAO_CDK: "2.1148.1"

jobs:
  detectar:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.lista.outputs.apps }}
      configurado: ${{ steps.config.outputs.configurado }}
    steps:
      - id: config
        env:
          CONTA_DEV: ${{ vars.AWS_CONTA_DEV }}
          CONTA_PROD: ${{ vars.AWS_CONTA_PROD }}
        run: |
          if [ -n "$CONTA_DEV" ] && [ -n "$CONTA_PROD" ]; then
            echo "configurado=true" >> "$GITHUB_OUTPUT"
          else
            echo "configurado=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy pulado::Variáveis AWS_CONTA_DEV e AWS_CONTA_PROD não configuradas neste repositório."
          fi
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: lista
        env:
          APP_INFORMADA: ${{ github.event.inputs.aplicacao }}
          ANTES: ${{ github.event.before }}
        run: |
          if [ -n "$APP_INFORMADA" ]; then
            apps="$APP_INFORMADA"
          elif [ -z "$ANTES" ] || [ "$ANTES" = "0000000000000000000000000000000000000000" ] \
               || ! git cat-file -e "$ANTES^{commit}" 2>/dev/null; then
            apps=$(ls apps)
          else
            apps=$(git diff --name-only "$ANTES" "${{ github.sha }}" | grep '^apps/' | cut -d/ -f2 | sort -u || true)
          fi
          json=$(for a in $apps; do [[ "$a" =~ ^[a-z][a-z0-9-]{2,29}$ ]] && [ -f "apps/$a/infra/cdk.json" ] && echo "$a"; done | jq -R . | jq -cs .)
          echo "apps=$json" >> "$GITHUB_OUTPUT"
          echo "Aplicações a implantar: $json"

  dev:
    needs: detectar
    if: needs.detectar.outputs.configurado == 'true' && needs.detectar.outputs.apps != '[]'
    runs-on: ubuntu-latest
    environment: desenvolvimento
    permissions:
      contents: read
      packages: read
      id-token: write
    strategy:
      matrix:
        app: ${{ fromJson(needs.detectar.outputs.apps) }}
    steps:
      - name: Mascarar IDs de conta e e-mail nos logs (repositório público)
        env:
          CONTA: ${{ vars.AWS_CONTA_DEV }}
          EMAIL: ${{ vars.EMAIL_ALERTAS }}
        run: |
          echo "::add-mask::$CONTA"
          [ -n "$EMAIL" ] && echo "::add-mask::$EMAIL" || true
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: npm install -g aws-cdk@${VERSAO_CDK}
      - name: Autenticar no GitHub Packages
        run: dotnet nuget update source infra-aws --username "${{ github.actor }}" --password "${{ secrets.GITHUB_TOKEN }}" --store-password-in-clear-text --configfile nuget.config
      - run: dotnet test apps/${{ matrix.app }}/backend/tests/*/ --nologo
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_CONTA_DEV }}:role/infra-aws-plataforma-github-deploy
          aws-region: us-east-1
          mask-aws-account-id: true
      - name: cdk deploy (dev)
        working-directory: apps/${{ matrix.app }}/infra
        env:
          EMAIL_ALERTAS: ${{ vars.EMAIL_ALERTAS }}
        run: cdk deploy --require-approval never -c ambiente=dev -c "emailAlerta=$EMAIL_ALERTAS"

  prod:
    name: prod (${{ matrix.app }})   # contrato com o Portal (ADR-027): não renomeie
    needs: [detectar, dev]
    if: needs.detectar.outputs.configurado == 'true' && needs.detectar.outputs.apps != '[]'
    runs-on: ubuntu-latest
    environment: producao   # regra de proteção (Portal, ADR-027): o job espera a liberação do gestor
    permissions:
      contents: read
      packages: read
      id-token: write
    strategy:
      matrix:
        app: ${{ fromJson(needs.detectar.outputs.apps) }}
    steps:
      - name: Mascarar IDs de conta e e-mail nos logs (repositório público)
        env:
          CONTA: ${{ vars.AWS_CONTA_PROD }}
          EMAIL: ${{ vars.EMAIL_ALERTAS }}
        run: |
          echo "::add-mask::$CONTA"
          [ -n "$EMAIL" ] && echo "::add-mask::$EMAIL" || true
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: npm install -g aws-cdk@${VERSAO_CDK}
      - name: Autenticar no GitHub Packages
        run: dotnet nuget update source infra-aws --username "${{ github.actor }}" --password "${{ secrets.GITHUB_TOKEN }}" --store-password-in-clear-text --configfile nuget.config
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_CONTA_PROD }}:role/infra-aws-plataforma-github-deploy
          aws-region: us-east-1
          mask-aws-account-id: true
      - name: cdk deploy (prod)
        working-directory: apps/${{ matrix.app }}/infra
        env:
          EMAIL_ALERTAS: ${{ vars.EMAIL_ALERTAS }}
        run: cdk deploy --require-approval never -c ambiente=prod -c "emailAlerta=$EMAIL_ALERTAS"
